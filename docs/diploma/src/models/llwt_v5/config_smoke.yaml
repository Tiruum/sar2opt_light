data:
  data_dir:
    sen12: ./data/sen12
    sen12_full: ./data/sen12_full
  dataset: sen12_full
  scenes:
  - '5'
  - '45'
  - '52'
  - '84'
  - '100'
  batch_size: 8
  val_batch_size: 4
  image_size: 256
  train_crop_size: null
  num_workers: 10
  prefetch_factor: 4
  persistent_workers: true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed: 42
  sar_channels: 1
model:
  gen:
    backbone: facebook/convnextv2-tiny-22k-224
    out_indices:
    - 1
    - 2
    - 3
    - 4
    use_sar_physics: true
    sar_channel2: despeckle
  dis:
    main:
      in_channels: 4
      ndf: 64
    subband:
      enabled: false
      ndf: 32
    fourier:
      enabled: false
      ndf: 32
      use_sn: true
  log_summary: false
optimizer:
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  weight_decay_g: 0.0
  use_bnb_8bit: true
scheduler:
  type: linear_decay
  eta_min: 1.0e-06
  linear_decay_epochs: 50
  t_0: 20
  t_mult: 2
ema:
  use_ema: true
  decay: 0.999
  start_epoch: 20
loss:
  gan_main_weight: 1.0
  gan_sub_weight: 0.0
  fm_main_weight: 10.0
  fm_sub_weight: 0.0
  l1_weight: 0.0
  msssim_weight: 1.0
  lab_chroma_weight: 0.0
  wavelet_weight: 0.0
  per_band_weight: 2.0
  per_band_ll: 1.0
  per_band_lh: 1.5
  per_band_hl: 1.5
  per_band_hh: 2.0
  per_band_adaptive: false
  per_band_log_var_init: 0.0
  gan_fourier_weight: 0.0
  fm_fourier_weight: 0.0
  lpips_weight: 2.0
  ffl_weight: 10.0
  ffl_alpha: 1.0
  patchnce_weight: 0.1
  patchnce_layers:
  - 0
  - 1
  - 2
  - 3
  patchnce_nc: 256
  patchnce_num_patches: 256
  patchnce_temperature: 0.07
  spkdec_weight: 0.0
  spkdec_target_hh: 0.05
  pr_weight: 0.0
  adaptive_balance: false
  adaptive_eta_max: 5.0
  r1_gamma: 0.0
  r1_main_every: 999999
  real_smooth: 1.0
  fake_smooth: 0.0
  gan_type: lsgan
  grad_clip_g: 1.0
  grad_clip_d: 5.0
system:
  device: cuda
  precision: bf16-mixed
  deterministic: false
  benchmark: true
  channels_last: true
  compile: false
  max_epochs: 10
  image_freq: 0
  limit_train_batches: 0.1
  limit_val_batches: 0.1
  check_val_every_n_epoch: 1
  empty_cache_each_epoch: true
  tb_version: smoke-rampfix
  weights_ckpt: null
  resume_ckpt: null
  debug: false
  checkpoints_dir: checkpoints/llwt_v45
  output_dir: ./output/llwt_v45
  images_dir: ./output/llwt_v45/images
  profiler_dir: ./output/llwt_v45/profiler
  summary_dir: ./output/llwt_v45/summary
