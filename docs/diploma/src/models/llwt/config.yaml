data:
  data_dir:
    sen12:      "./data/sen12"
    sen12_full: "./data/sen12_full"
  dataset:               "sen12_full"
  # Same 9-scene subset used by the sarformer_wb runs so PSNR/LPIPS/FID
  # numbers are directly comparable across model families.  Set scenes: null
  # to use ALL scenes (~282k pairs).
  scenes:                ["5", "45", "52", "84", "100"] # ["5", "10", "25", "35", "45", "47", "52", "84", "100"]
  batch_size:            16                         # train @ 128 crop; ~10 GB VRAM with 8-bit Adam + NHWC
  val_batch_size:        4                          # val @ 256 full-res; smaller bs because pixels per sample 4x larger
  image_size:            256                        # base resize (val uses this as-is; train crops down to train_crop_size)
  train_crop_size:       128                        # patch-train lever — 4x fewer pixels per step, val numbers stay at 256
  num_workers:           6
  prefetch_factor:       2
  persistent_workers:    true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1

model:
  gen:
    embed_dim:        96                            # main channel width through the lifting + per-subband stacks
    lifting_levels:   3                             # L1=128, L2=64, L3=32
    lifting_hidden:   32                            # hidden width of each Predict / Update sub-net
    pswe:
      window_size:    8
      heads:          4
      depth:          2                             # SwinV2-style blocks per band per level
      shared_blocks:  false                         # one stack per band (max novelty); set true for ablation
    cba_fus:
      levels:         [2, 3]                        # only at L2 (64) and L3 (32); L1 is too many tokens
      heads:          4
    pcsg:
      enabled:        true
      gain_ll:        0.1                           # LL gets * (1 + 0.1*g); HH gets * (1 - g)
  dis:
    main:
      in_channels:    4                             # SAR(1) + opt(3)
      ndf:            64
    subband:
      enabled:        true                          # subband-D head -- novelty axis #5
      ndf:            32
  log_summary: true

optimizer:
  lr_g:           2.0e-4
  lr_d:           1.0e-4                            # TTUR (lr_d < lr_g) -- mandatory per past-run audit
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.0                               # cfrwd-36 lesson: wd=0 on G recovers best image quality
  use_bnb_8bit:   true                              # bnb 8-bit AdamW/Adam — ~700 MB VRAM saved vs fp32 fused. Auto-falls back to torch fused on ImportError.

scheduler:
  type:                "cosine_warm_restarts"
  eta_min:             1.0e-6
  linear_decay_epochs: 60
  t_0:                 20
  t_mult:              2

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 10

loss:
  # v0.2.0 pix2pixHD-style: pure GAN + FM. Subband-D is now load-bearing
  # (gan_sub 0.5->1.0, fm_sub 5->10). All recon losses zeroed — factory.py
  # gates instantiation behind weight > 0, so MS-SSIM/LAB/LPIPS forwards never
  # execute. Saves ~150 MB VRAM and ~15% step time.
  gan_main_weight:        1.0
  gan_sub_weight:         1.0                       # 0.5 -> 1.0 — subband-D is the only HF supervision left
  fm_main_weight:         10.0
  fm_sub_weight:          10.0                      # 5.0 -> 10.0 — subband-D feature matching doubled
  l1_weight:              0.0                       # 50.0 -> 0 — kill the L1 mean-attractor blur trap
  msssim_weight:          0.0                       # 1.0 -> 0 — drop low-pass-biased SSIM
  lab_chroma_weight:      0.0                       # 5.0 -> 0
  wavelet_weight:         0.0                       # 2.0 -> 0
  lpips_weight:           0.0                       # 1.0 -> 0
  # LLW-Former physics priors — tiny, kept. Not learning signals; the lifting
  # wavelet must stay interpretable (LL ~ despeckled SAR) and invertible.
  spkdec_weight:          0.05
  spkdec_target_hh:       0.05
  pr_weight:              0.01
  # Mode-collapse hardening — extra important now that no pixel anchor exists.
  adaptive_balance:       false
  adaptive_eta_max:       5.0
  r1_gamma:               0.5
  r1_main_every:          16                        # R1 on main-D only; subband-D too cheap to need it
  grad_clip_g:            1.0
  grad_clip_d:            5.0

system:
  device:        "cuda"
  precision:     "bf16-mixed"
  deterministic: false
  benchmark:     true                               # cuDNN autotunes conv algos for fixed input shapes -- math identical, faster kernel pick
  channels_last: true                               # NHWC memory format — +10-15% on conv-heavy Ada kernels with cuDNN benchmark
  compile:       false                              # Windows venv lacks triton — eager only. Set true when running from WSL2 (.venv_wsl).
  max_epochs:    20                                 # SMOKE: 20-ep validation of pure GAN+FM recipe; bump to 120 for 9-scene production
  image_freq:    2                                  # save val grid every 2 ep — early sharpness inspection during smoke
  limit_train_batches: 1.0
  limit_val_batches:   1.0
  check_val_every_n_epoch: 2                        # val at 256 is the heaviest op; ep2 cadence halves LPIPS+FID cost

  tb_version:    "llwt-v0.2.0-smoke-5scenes"        # SMOKE for pix2pixHD-style loss surgery; switch to llwt-v0.2.0 for 9-scene production
  weights_ckpt:  null                               # FRESH START — pure GAN+FM has a different optimum than the L1-anchored v0.1.0 ckpt
  resume_ckpt:   null                               # FRESH START
  debug:         false
  checkpoints_dir: "checkpoints/llwt"
  output_dir:      "./output/llwt"
  images_dir:      "./output/llwt/images"
  profiler_dir:    "./output/llwt/profiler"
  summary_dir:     "./output/llwt/summary"
