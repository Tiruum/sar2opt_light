data:
  data_dir:
    sen12:      "./data/sen12"
    sen12_full: "./data/sen12_full"
  dataset:               "sen12_full"
  scenes:                ["5", "45", "52", "84", "100"]
  batch_size:            8
  image_size:            256
  num_workers:           3
  prefetch_factor:       2
  persistent_workers:    true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1

model:
  gen:
    backbone:          "facebook/convnextv2-tiny-22k-224"
    out_indices:       [1, 2, 3, 4]
    bottleneck_dim:    768
    bottleneck_heads:  8
    bottleneck_layers: 2
  dis:
    ndf:         64
    in_channels: 4
  log_summary: true

optimizer:
  lr_g:           2.0e-4
  lr_d:           2.0e-4
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.01

scheduler:
  eta_min:             1.0e-6
  linear_decay_epochs: 400

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 30

loss:
  gan_weight:        1.0
  fm_weight:         5.0
  fft_weight:        1.0
  perceptual_weight: 0.1

system:
  device:        "cuda"
  precision:     "bf16-mixed"
  deterministic: false
  benchmark:     false
  compile:       false
  max_epochs:    800
  image_freq:    10
  limit_train_batches: 1.0
  limit_val_batches:   1.0
  tb_version:    "hfgan-1"
  resume_ckpt:   "checkpoints/huggingface-gan/last.ckpt"
  debug:         false
  checkpoints_dir: "checkpoints/huggingface-gan"
  output_dir:      "./output/huggingface-gan"
  images_dir:      "./output/huggingface-gan/images"
  profiler_dir:    "./output/huggingface-gan/profiler"
  summary_dir:     "./output/huggingface-gan/summary"
