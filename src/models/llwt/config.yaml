data:
  data_dir:
    sen12:      "./data/sen12"
    sen12_full: "./data/sen12_full"
  dataset:               "sen12_full"
  # Same 9-scene subset used by the sarformer_wb runs so PSNR/LPIPS/FID
  # numbers are directly comparable across model families.  Set scenes: null
  # to use ALL scenes (~282k pairs).
  scenes:                ["5", "10", "25", "35", "45", "47", "52", "84", "100"]
  batch_size:            6                          # 16 GB VRAM @ 256x256 + 27M params
  image_size:            256
  num_workers:           6
  prefetch_factor:       2
  persistent_workers:    true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1

model:
  gen:
    embed_dim:        96                            # main channel width through the lifting + per-subband stacks
    lifting_levels:   3                             # L1=128, L2=64, L3=32
    lifting_hidden:   32                            # hidden width of each Predict / Update sub-net
    pswe:
      window_size:    8
      heads:          4
      depth:          2                             # SwinV2-style blocks per band per level
      shared_blocks:  false                         # one stack per band (max novelty); set true for ablation
    cba_fus:
      levels:         [2, 3]                        # only at L2 (64) and L3 (32); L1 is too many tokens
      heads:          4
    pcsg:
      enabled:        true
      gain_ll:        0.1                           # LL gets * (1 + 0.1*g); HH gets * (1 - g)
  dis:
    main:
      in_channels:    4                             # SAR(1) + opt(3)
      ndf:            64
    subband:
      enabled:        true                          # subband-D head -- novelty axis #5
      ndf:            32
  log_summary: true

optimizer:
  lr_g:           2.0e-4
  lr_d:           1.0e-4                            # TTUR (lr_d < lr_g) -- mandatory per past-run audit
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.0                               # cfrwd-36 lesson: wd=0 on G recovers best image quality

scheduler:
  type:                "cosine_warm_restarts"
  eta_min:             1.0e-6
  linear_decay_epochs: 60
  t_0:                 20
  t_mult:              2

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 10

loss:
  # Adversarial (main + subband).  gan_sub=0.5 keeps the subband-D as a
  # supplementary signal, not a load-bearing one (it shares L1's job of
  # preventing mode collapse if main-D dominates).
  gan_main_weight:        1.0
  gan_sub_weight:         0.5
  fm_main_weight:         10.0
  fm_sub_weight:          5.0
  # Pixel anchor and frequency-aware reconstruction stack.  l1=50 keeps the
  # recon:adv ratio at ~5:1 (the ratio that produced the sharpest visuals in
  # sarformer-wb-2; <5:1 -> blur, >10:1 -> chroma collapse).
  l1_weight:              50.0
  msssim_weight:          1.0
  lab_chroma_weight:      5.0
  wavelet_weight:         2.0                       # L1 on Haar detail subbands (data-side, not network-side)
  lpips_weight:           1.0                       # AlexNet LPIPS pulls toward perceptual distribution
  # LLW-Former novelty regularisers (physics-informed speckle decoupling).
  spkdec_weight:          0.05
  spkdec_target_hh:       0.05
  pr_weight:              0.01
  # Mode-collapse hardening.
  adaptive_balance:       false
  adaptive_eta_max:       5.0
  r1_gamma:               0.5
  r1_main_every:          16                        # R1 on main-D only; subband-D too cheap to need it
  grad_clip_g:            1.0
  grad_clip_d:            5.0

system:
  device:        "cuda"
  precision:     "bf16-mixed"
  deterministic: false
  benchmark:     true                               # cuDNN autotunes conv algos for fixed input shapes -- math identical, faster kernel pick
  compile:       true                               # netG only; netD eager so R1 + bf16 path stays safe. Saves ~30% step time after one-time 180s compile cost.
  max_epochs:    120
  image_freq:    5
  limit_train_batches: 1.0
  limit_val_batches:   1.0
  tb_version:    "llwt-v0.1.0"
  weights_ckpt:  null                               # FRESH START -- no warm-start (per plan, avoids brown-soup anchor)
  resume_ckpt:   null
  debug:         false
  checkpoints_dir: "checkpoints/llwt"
  output_dir:      "./output/llwt"
  images_dir:      "./output/llwt/images"
  profiler_dir:    "./output/llwt/profiler"
  summary_dir:     "./output/llwt/summary"
