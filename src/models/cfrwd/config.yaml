# configs/config.yaml
data:
  data_dir:
    labeled: "./data/labeled"
    sen12: "./data/sen12"
    sen12_full: "./data/sen12_full"
    qxslab: "./data/qxslab"
  dataset: "sen12_full" # "sen12_full" or "sen12"
  scenes: ["5", "45", "52", "84", "100"]
  batch_size: 8
  image_size: 256
  num_workers: 3  # на Windows spawn=6+6=12 процессов (~5 ГБ); 3+3=6 процессов (~2.4 ГБ)
  train_val_split_ratio: 0.8
  prefetch_factor: 2
  persistent_workers: true
  use_train_common_transform: true
  seed: 42
  sar_channels: 1

model:
  gen:
    ngf: 64
    in_channels: 1
  dis:
    ndf: 64
    in_channels: 4 # 1 (SAR) + 3 (OPT)
  log_summary: true

optimizer:
  lr_g: 5.6e-4 # Статья BS=1: 2e-4. Sqrt scaling для BS=4: 2e-4 × sqrt(4) = 4e-4
  lr_d: 5.6e-4 # Одинаковый lr для G и D
  beta1: 0.5
  beta2: 0.999

scheduler:
  eta_min: 1.0e-6
  linear_decay_epochs: 200 # Пропорционально max_epochs: последние 50% (=400/800)

ema:
  use_ema: true
  decay: 0.999
  start_epoch: 30

loss:
  gan_weight: 1
  fm_weight: 10
  wavelet_weight: 1.0   # L1 on Haar detail subbands of HFCF output
  use_log_preprocessing: false  # log(1+relu(x)) before DWT — worsens SEN12 |rho| (0.16→0.77), enable only for QXSLAB
  use_lpips: false

system:
  device: "cuda"
  precision: "bf16-mixed" # 32, 16, "bf16-mixed"
  deterministic: false
  benchmark: false  # true выделяет huge cuDNN workspace при многих уникальных формах (CFRBlock/HFCFBranch → 50+ shapes → до 16 ГБ кэша)
  compile: false # torch.compile() — только Linux (Triton не поддерживает Windows)
  max_epochs: 400 # Статья: 200 при BS=1. Полный эквивалент BS=8: 200×(8/1)=1600. Используем 400 — ~2× больше чем статья.
  checkpoints_dir: "checkpoints/cfrwd"
  image_freq: 10
  output_dir: "./output/cfrwd"
  images_dir: "./output/cfrwd/images"
  profiler_dir: "./output/cfrwd/profiler"
  summary_dir: "./output/cfrwd/summary"
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  tb_version: "physics-1"
  resume_ckpt: null
  debug: false