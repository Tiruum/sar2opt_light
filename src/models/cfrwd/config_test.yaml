# Тестовый конфиг для быстрой валидации исправлений (10 эпох, 10% данных)
# Использование: скопировать в src/models/cfrwd/config.yaml или запустить с переопределением

data:
  data_dir:
    labeled: "./data/labeled"
    sen12: "./data/sen12"
  batch_size: 8
  image_size: 256
  num_workers: 6
  train_val_split_ratio: 0.8
  prefetch_factor: 2
  persistent_workers: true
  use_train_common_transform: true
  seed: 42
  sar_channels: 1

model:
  gen:
    ngf: 64
    in_channels: 1
  dis:
    ndf: 64
    in_channels: 4
  log_summary: false

optimizer:
  # TTUR (Two Time-Scale Update Rule)
  lr_g: 1e-4
  lr_d: 4e-4
  beta1: 0.5
  beta2: 0.999

scheduler:
  eta_min: 0
  linear_decay_epochs: 5  # Короткий decay для быстрого теста

ema:
  use_ema: false  # Отключаем EMA для быстрого теста
  decay: 0.999
  start_epoch: 30

loss:
  # ВКЛЮЧАЕМ L1! Критично для структурной точности
  l1_weight: 100
  gan_weight: 1
  fm_weight: 10

fusion:
  init_weight: 0.5
  min_weight: 0.1
  max_weight: 2.0
  weight_decay: 0.01

system:
  device: "cuda"
  precision: "bf16-mixed"
  deterministic: false
  benchmark: true
  compile: false
  max_epochs: 10  # БЫЛО: 200 → СТАЛО: 10 (быстрый тест)
  checkpoints_dir: "checkpoints/cfrwd"
  image_freq: 1  # Визуализация каждый epoch
  output_dir: "./output/cfrwd"
  images_dir: "./output/cfrwd/images"
  profiler_dir: "./output/cfrwd/profiler"
  summary_dir: "./output/cfrwd/summary"
  limit_train_batches: 0.1  # 10% данных для быстрого теста
  limit_val_batches: 0.1    # 10% данных для быстрой валидации
  tb_version: 'cfrwd-33-test'  # Новая версия для чистого эксперимента
  resume_ckpt: null
  debug: true
