data:
  data_dir:
    sen12:      "./data/sen12"
    sen12_full: "./data/sen12_full"
  dataset:               "sen12_full"
  # Expanded from paper-subset (5/45/52/84/100) to 9 scenes; +47/+10/+25/+35
  # all exist in 3-4 of the 4 seasons, so they widen seasonal coverage without
  # adding any single-season-only scene (which would bias the val split).
  # Set `scenes: null` to use ALL ~150 scenes (~282k pairs) for full diversity.
  scenes:                ["5", "10", "25", "35", "45", "47", "52", "84", "100"]
  batch_size:            8
  image_size:            256
  num_workers:           6
  prefetch_factor:       2
  persistent_workers:    true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1

model:
  gen:
    backbone:        "microsoft/swinv2-tiny-patch4-window8-256"
    out_indices:     [1, 2, 3, 4]   # Swin V2: indices 1..4 yield (96/64,192/32,384/16,768/8); index 0 is patch-embed pre-stage and would duplicate stage 1.
    encoder_lr_scale: 0.1            # Swin V2 pretrained: 10x lower LR than decoder
    decoder:
      use_grn:         true          # ConvNeXt V2 GRN in each decoder block
      droppath:        0.1
  dis:
    main:
      ndf:           64
      in_channels:   4                # SAR(1) + opt(3)
      scales:        ["coarse", "fine"]   # 2-scale; micro dropped vs hfgan-18
  log_summary: true

optimizer:
  lr_g:           2.0e-4
  lr_d:           1.0e-4
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.0

scheduler:
  type:                "cosine_warm_restarts"   # "linear_decay" | "cosine_warm_restarts"
  eta_min:             1.0e-6
  linear_decay_epochs: 60                        # only used when type=linear_decay
  t_0:                 20                        # first restart period (epochs); cosine_warm_restarts only
  t_mult:              2                         # period multiplier after each restart

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 10

loss:
  # sarformer-wb-3-simple: wavelet bottleneck, SAR cross-attn skips, Phi-D,
  # uncertainty L1, and speckle-consistency loss were all removed.  Loss stack
  # is now plain L1 + MS-SSIM + LAB-chroma + wavelet-detail + GAN+FM (main D).
  # sarformer-wb-4-sharp rebalance: L1=50 was 5x too strong vs original
  # uncertainty_weight=10 (which is effectively L1@10 at s≈0).  Recon was
  # dominating adversarial 33:1 → blur.  Drop L1 to 10, restore lab_chroma=5,
  # push GAN 1→2 and halve FM 10→5 (FM is feature-L1, also smooths).  New
  # recon:adv ratio ≈ 5.6:1.
  gan_main_weight:        2.0
  fm_main_weight:         10.0
  l1_weight:              0.0
  msssim_weight:          1.0
  lab_chroma_weight:      5.0
  wavelet_weight:         1.0      # L1 on Haar detail subbands of (y, y_hat)
  adaptive_balance:       false
  adaptive_eta_max:       5.0
  r1_gamma:               0.5
  r1_main_every:          16       # reverted from 32 -- main-D only, can afford the cadence
  grad_clip_g:            1.0      # AdamW grad clip on the G optimizer (manual-opt → must be explicit)
  grad_clip_d:            5.0      # main-D grad clip

system:
  device:        "cuda"
  precision:     "bf16-mixed"     # bf16 forward + fp32 R1 (isolated in main.py:_r1_penalty).
  deterministic: false
  benchmark:     false
  compile:       false             # disabled — `torch.compile` interacts badly with R1 second-order grad under bf16-mixed.
  max_epochs:    80
  image_freq:    5
  limit_train_batches: 1.0
  limit_val_batches:   1.0
  tb_version:    "sarformer-wb-4-sharp"
  weights_ckpt:  "checkpoints/sarformer-wb/sarformer-wb-4-sharp/last.ckpt"
  resume_ckpt:   null
  debug:         false
  checkpoints_dir: "checkpoints/sarformer-wb"
  output_dir:      "./output/sarformer-wb"
  images_dir:      "./output/sarformer-wb/images"
  profiler_dir:    "./output/sarformer-wb/profiler"
  summary_dir:     "./output/sarformer-wb/summary"
