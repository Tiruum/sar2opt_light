data:
  data_dir:
    sen12:            "./data/sen12"
    sen12_full:       "./data/sen12_full"
    sen12_full_align: "./data/sen12_full_align"   # gradient-domain phaseCorrelate->ECC aligned mirror (scripts/align_pairs.py); SAR byte-identical, optical warped
    qxs_saropt:       "./data/QXSLAB_SAROPT"      # QXSLAB SAR-OPT (Gaofen-3 SAR + Google Earth optical), 20k 256x256 paired patches; flat layout sar_256_oc_0.2/ + opt_256_oc_0.2/
  dataset:               "sen12_full"              # SAWG trains on RAW (unaligned) data: the learned online aligner attacks real misregistration in-loop (replaces offline ECC). switch: "sen12_full" (raw) | "sen12_full_align" (aligned A/B) | "qxs_saropt" (QXSLAB transfer-learning target). train.py picks the matching datamodule + data_root.
  # Same 5-scene subset for the smoke. Switch to the 9-list before the
  # production run: ["5","10","25","35","45","47","52","84","100"].
  # NOTE: ignored when dataset=='qxs_saropt' (QXS layout has no scene partition).
  scenes:                ["5", "45", "52", "84", "100"]
  batch_size:            6                          # base backbone @ 256 full-res (tiny backbone -> 8)
  val_batch_size:        4                          # val @ 256 full-res
  image_size:            256                        # train + val same resolution — back to full-res training
  train_crop_size:       null                       # patch-train disabled; null means no RandomCrop in the train pipeline
  num_workers:           10                         # raised 6->10: train was GPU-starved (16% util); feed the loader harder
  prefetch_factor:       4                           # raised 2->4: deeper per-worker prefetch queue to hide cv2 decode latency
  persistent_workers:    true                       # MUST stay true on Windows: false respawns all workers each epoch via spawn (~6s torch re-import x num_workers = ~60s/epoch wasted) and did NOT fix the ramp.
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1
  sar_lognorm:           false                      # true = log1p-stretch SAR before mean/std normalize. Recommended for raw-amplitude SAR (QXS Gaofen-3: skew +1.37 -> -0.31 with log1p). Leave false for SEN1-2 (GRD already pre-stretched, mean≈median≈126).

model:
  gen:
    # HuggingFace AutoBackbone name. gen.py reads hidden_sizes from the encoder
    # config so stage dims auto-adapt — capacity is a pure config switch:
    #   base : facebook/convnextv2-base-22k-224  (~88M, hidden=(128,256,512,1024), data.batch_size=6)
    #   tiny : facebook/convnextv2-tiny-22k-224  (~29M, hidden=(96,192,384,768),  data.batch_size=8)
    backbone:         "facebook/convnextv2-base-22k-224"
    out_indices:      [1, 2, 3, 4]                  # HF ConvNeXt V2 stage_names = stem + stage1..4; want the 4 stages
    use_sar_physics:  true                          # SARAdapter (raw / channel2 / Sobel-grad) before Haar-Stem
    sar_channel2:     despeckle                     # v0.4.5: log-domain adaptive Lee — A/B WINNER (FID -10%, KID -29%, LPIPS -3% vs log|x|; PSNR flat). 'log' = v4 fallback.
  dis:
    main:
      in_channels:    4                             # SAR(1) + opt(3)
      ndf:            64
    subband:
      enabled:        false                         # v0.4.5: DISABLED — SubbandDis logits explode (~1.8e5, fp32-confirmed), swamping all perceptual losses under grad-clip. Re-enable only after adding spectral-norm/output-norm + fresh (non-warm) D train.
      ndf:            32
    fourier:
      enabled:        false                         # S-stage (S1+S2) rejected — FourierDis redundant with SubbandDis Haar discrimination
      ndf:            32                            # matches subband ndf; drop to 16 if VRAM tight
      use_sn:         true                          # spectral norm; keep on for tri-D stability
    highfreq:
      enabled:        true                          # HF-D: conditional SN-PatchGAN on optical high-pass (x - gaussian_blur(x,sigma)). Forces COHERENT high-freq detail. VERIFIED on held-out A/B: mid-freq 0.65->0.70, detail-power 0.63->0.69, high-band stayed <1.0 (coherent not noise), LPIPS flat, D stable. Gated ALSO by loss.hfd_weight>0. Spectral-norm on every conv is ESSENTIAL (subband-D exploded to 1e5 without it).
      ndf:            64                            # mirrors main-D coarse branch width
      sigma:          2.0                           # gaussian-blur sigma for the high-pass split
  log_summary: true

optimizer:
  lr_g:           2.0e-4                            # restored original — overfit-l1 confirmed arch climbs to 33 dB at 5e-4 / 3000 iter
  lr_d:           2.0e-4                            # equal LR (no TTUR penalty on either side)
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.0
  use_bnb_8bit:   false                             # false = torch fused AdamW/Adam (fp32 state, no quant noise, +~700MB VRAM). true = bnb 8-bit (saves ~700MB). NOTE: switching changes optimizer state — break strict resume_ckpt; fine for fresh / weights_ckpt warm-start.

scheduler:
  type:                "linear_decay"                # v0.4.3 headline: constant LR for first (max_epochs - linear_decay_epochs) epochs, then linear decay to eta_min — avoids cosine restart wreckage AND constant-LR late oscillation
  eta_min:             1.0e-6
  linear_decay_epochs: 50                            # last 25% of 200ep = decay phase; first 150ep stay at constant LR for D-G equilibrium
  t_0:                 20
  t_mult:              2

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 20                                   # delayed EMA start for 200ep run — give G+D more time to stabilize before averaging kicks in

loss:
  # v0.3.0 inherits the v0.2.x pix2pixHD-style pure GAN+FM recipe. Subband-D
  # is load-bearing (gan_sub=1.0, fm_sub=10.0). Wavelet branch has its own
  # internal SpeckleAwareModule gates so no spkdec loss is needed; the
  # generator has no learnable lifting so PR is undefined too.
  gan_main_weight:        1.0
  gan_sub_weight:         0.0                       # v0.4.5: subband-D disabled (see model.dis.subband.enabled)
  fm_main_weight:         10.0                      # FM=10 was doing the G training work — cutting it crashed PSNR
  fm_sub_weight:          0.0                       # v0.4.5: subband-D disabled (exploding feats ~1e5)
  l1_weight:              0.0
  msssim_weight:          1.0                       # v0.4.5: 1-MS-SSIM — direct non-blurring SSIM lever
  lab_chroma_weight:      0.0
  wavelet_weight:         0.0
  # Per-band wavelet L1 (v0.4.1 stage 2). Computes L1 between predicted Haar
  # subbands (B,3,4,H/2,W/2) and HaarDown(opt). Per-band weights are RATIOS —
  # sum-of-weights normalised inside the loss so per_band_weight is the only
  # scale knob. Magnitude at steady state (equal sub-weights):
  #   L1_LL ≈ 0.05, L1_detail ≈ 0.03 each
  #   mean weighted ≈ 0.035; contribution at master=2.0 ≈ 0.07
  #   (comparable to gan_main ≈ 0.05; safe vs FM ≈ 0.20 each).
  # Mutual exclusion with wavelet_weight: factory raises if both > 0.
  # Default 0.0 = stage-2 inert (v0.4.0 behaviour); set 2.0 to opt in.
  per_band_weight:        2.0
  per_band_ll:            1.0
  per_band_lh:            1.5
  per_band_hl:            1.5
  per_band_hh:            2.0
  # v0.4.1 R4 — switchable Kendall uncertainty weighting on per-band L1.
  # When true, per_band_{ll,lh,hl,hh} above are IGNORED and band weights are
  # learned via a 4-vector log_var Parameter (clamped [-3, 3], σ ∈ [0.05, 5]).
  # Adds 4 learnable params to opt_g (negligible cost).  log_var_init=0.0 →
  # σ=1 → starts as equal-weight (matches R1 init).  Set false to revert to
  # the manual ratios above.  Mutually exclusive with wavelet_weight (factory
  # check is identical for both modes).
  per_band_adaptive:      false
  per_band_log_var_init:  0.0
  # FFS — WaveletDetailSWDLoss (sliced-Wasserstein on the Haar detail subbands
  # LH/HL/HH of predicted_sub). Shift-invariant blur penalty: compares the
  # SORTED detail-coefficient distribution (not position-by-position), so a
  # sharp-but-shifted edge is NOT punished and a blur (collapsed detail
  # distribution) IS. Independent of per_band — both consume predicted_sub but
  # SWD touches only the 3 detail bands, so they can coexist (e.g. per_band
  # LL-only + SWD on detail). Default 0.0 = OFF (no behaviour change). Set ~2-5
  # to opt in; raw l_swd ~ same order as per_band detail L1, so a comparable
  # contribution needs a comparable weight. swd_n_proj>0 adds channel-sliced SW
  # (resume-safe frozen directions); default 0 = per-channel sort only.
  swd_weight:             0.0
  swd_n_proj:             0
  # Fourier-D adversarial weights (v0.4.2 stage 3). Default 0.0 = stage-3 inert
  # (v0.4.0/v0.4.1 behaviour); set 1.0/10.0 to match gan_sub/fm_sub when enabled.
  gan_fourier_weight:     0.0
  fm_fourier_weight:      0.0
  # High-frequency D adversarial weight (G-side). When > 0 AND
  # model.dis.highfreq.enabled, the D-phase also updates the HF-D on
  # highpass(real) vs highpass(fake.detach()), and the G-phase adds
  # hfd_weight * gan_loss(HF_D(highpass(fake)), real=True). Additive to the
  # main D. ~1.0 matches gan_main_weight scale. Default 0.0 = OFF.
  hfd_weight:             1.0                       # HF-D headline lever. SET 0 to disable HF-D (reproduces plain baseline / ablation arm). VERIFIED winning lever — adversarial high-freq detail sharpening (held-out A/B beat baseline + the rejected SWD/aligner). Matches gan_main scale.
  lpips_weight:           2.0                       # v0.4.5: AlexNet perceptual anchor (~0.9 contribution; main photorealism driver)
  # v0.4.5 Focal Frequency Loss (Jiang ICCV 2021) — global FFT-domain sharpener.
  # Complementary to per_band (local Haar subbands); needs `focal-frequency-loss`.
  ffl_weight:             10.0                      # v0.4.5: raw FFL ~0.03 -> x10 ~0.3 contribution (FFT-domain sharpener)
  ffl_alpha:              1.0
  # v0.4.5 PatchNCE (CUT, Park 2020) — misalignment-robust contrastive supervision
  # in the generator's own encoder space (attacks SEN12 SAR<->optical misregistration
  # that caps SSIM). layers index encode_optical's [s0,s1,s2,s3] pyramid.
  patchnce_weight:        0.1                       # v0.4.5: raw InfoNCE ~5 -> x0.1 ~0.5 contribution (else dominates)
  patchnce_layers:        [0, 1, 2, 3]
  patchnce_nc:            256
  patchnce_num_patches:   256
  patchnce_temperature:   0.07
  spkdec_weight:          0.0                       # OFF — no learnable lifting in v0.3.0
  spkdec_target_hh:       0.05
  pr_weight:              0.0                       # OFF — no PR contract to enforce
  adaptive_balance:       false
  adaptive_eta_max:       5.0
  # D-collapse fix set (smoke v1 stuck at d_real≈d_fake≈0.45):
  #  * r1_gamma=0 + r1_main_every huge — spectral_norm already enforces
  #    Lipschitz; R1 on top drove D to constant. Skipping the R1 branch keeps
  #    the fast batched-D path on every step.
  #  * real_smooth=1.0 — old (0.9, 0.0) made the LSGAN degenerate fixed point
  #    exactly (0.9+0)/2=0.45 = the observed plateau.
  r1_gamma:               0.0
  r1_main_every:          999999
  real_smooth:            1.0
  fake_smooth:            0.0
  gan_type:               "lsgan"                   # back to LSGAN — hinge saturated worse on overfit (d_loss=2.0)
  grad_clip_g:            1.0
  grad_clip_d:            5.0

align:
  enabled:            false    # DISABLED: learned dense aligner proven INERT (SAR-opt local NCC~0.02 modality gap; phi pinned ~0.07px). Turns off aligner + deform_reg/psc_anchor/bsc. Headline contribution is the HF-D (model.dis.highfreq + loss.hfd_weight). false also = clean baseline vs HF-D ablation.
  max_disp_px:        8.0      # tanh-bounded max deformation (pixels)
  phi_hidden:         64       # aligner conv width
  reg_smooth_weight:  3.0      # TV smoothness on phi. 10->3: diag_aligner proved reg pinned phi at 0.07px (g_reg/g_fid=0.89); loosened to let phi engage.
  reg_mag_weight:     0.5      # magnitude penalty on phi. 2->0.5: mag grad ~4*phi dominated at small phi (the council 1->2 bump backfired = aligner inert). Reg-free ceiling was 0.21px so this should reach ~0.15-0.2px.
  psc_anchor_weight:  1.0      # contribution A master weight
  psc_anchor_lambda:  4.0      # fidelity up-weight at scattering centers
  psc_corr_weight:    0.25     # PSC<->structure correspondence sub-weight (council: 1->0.25 de-risks the unbounded-negative corr term / runaway-sharpening pull on aligner; anchored-fidelity term alone delivers contribution A)
  psc_topk:           64       # scattering centers per patch
  bsc_weight:         0.5      # contribution B master weight
  bsc_struct_weight:  1.0      # structure-reward sub-weight inside BSC

system:
  device:        "cuda"
  precision:     "bf16-mixed"
  deterministic: false
  benchmark:     true
  channels_last: true                               # NHWC memory format — +10-15% on conv-heavy Ada kernels
  compile:       false                              # Windows venv lacks triton — eager only
  max_epochs:    200                                 # v0.4.3 headline: 200ep warm-start from R2 ep56 (best W3 ckpt) for max-quality production training
  image_freq:    5                                   # 200ep / 5 = 40 visualizations — manageable disk footprint
  limit_train_batches: 1.0                           # prod: full train set per epoch
  limit_val_batches:   1.0                           # prod: full val set per epoch
  check_val_every_n_epoch: 1
  use_kid:        false                              # KID val metric. false drops the 23.9M InceptionV3 (VRAM + per-step EMA-floor savings; skips val KID compute). FID still reported. NOTE: toggling changes module state_dict — break strict resume_ckpt; use weights_ckpt (strict=False) across the switch.
  empty_cache_each_epoch: false                      # OFF: the per-epoch ramp was a torchmetrics-LPIPS-as-loss tensor leak (fixed in losses.py), NOT allocator fragmentation. empty_cache() here was proven ineffective (ON==OFF in A/B) and only adds cudaFree+malloc cost per epoch. Mem probes in main.py stay on to confirm train_epoch_sec is flat post-fix.

  tb_version:    "llwt-v0.6.0-base-hfd"              # consolidated default: base backbone + HF-D. Warm-start the base generator (trained without HF-D); HF-D engages from step 0.
  weights_ckpt:  "checkpoints/llwt_v45_base/llwt-v0.4.6-base/epoch=199-psnr=18.5361.ckpt"   # warm-start G (strict=False); base generator. For tiny: checkpoints/llwt_v45/llwt-v0.4.6-align-ws/last.ckpt
  resume_ckpt:   null
  debug:         false
  checkpoints_dir: "checkpoints/llwt_v45"
  output_dir:      "./output/llwt_v45"
  images_dir:      "./output/llwt_v45/images"
  profiler_dir:    "./output/llwt_v45/profiler"
  summary_dir:     "./output/llwt_v45/summary"
