data:
  data_dir:
    sen12:      "./data/sen12"
    sen12_full: "./data/sen12_full"
  dataset:               "sen12_full"
  scenes:                ["5", "45", "52", "84", "100"]      # 5-scene smoke; production: ["5","10","25","35","45","47","52","84","100"]
  batch_size:            4                                    # bs=4 keeps headroom for the 2nd encoder forward (PatchNCE) at 16 GB; bump to 8 if VRAM stays < 13 GB during smoke
  val_batch_size:        2
  image_size:            256
  train_crop_size:       null
  num_workers:           6
  prefetch_factor:       2
  persistent_workers:    true
  use_train_common_transform: true
  train_val_split_ratio: 0.8
  seed:                  42
  sar_channels:          1

model:
  gen:
    # Top encoder for 16 GB VRAM. SwinV2-Base 22k pretrained (~87 M params).
    # Alternative backbones tested via this knob:
    #   * facebook/convnextv2-base-22k-224  (HF AutoBackbone, FCMAE pretrained, ~89 M)
    #   * facebook/convnextv2-tiny-22k-224  (smaller, faster smoke)
    backbone:         "microsoft/swinv2-tiny-patch4-window8-256"
    # Swin V2 stage_names = ['embeddings', 'stage1', 'stage2', 'stage3', 'stage4']
    # We want the 4 actual stages (indices 1..4), not the patch-embed (index 0).
    # Tiny: hidden_sizes=(96,192,384,768), ~28M backbone. ~3x faster than Base.
    # Native 256x256 input -- no pos-bias interpolation needed.
    out_indices:      [1, 2, 3, 4]
    use_sar_physics:  true
    # PGCA: Physics-Guided Cross-Attention at each decoder stage. Q = decoder feature,
    # K/V = SAR-physics pyramid (raw + log + sobel, downsampled to stage resolution).
    pgca_enabled:     true
    pgca_window:      8                                      # 8x8 window-partitioned cross-attention -> linear complexity
    pgca_heads:       8

  dis:
    # HFGANDiscriminator: 3-scale conditional PatchGAN (70/46/22 RF).
    in_channels:   4                                          # SAR(1) + opt(3)
    ndf:           64

  log_summary: true

optimizer:
  lr_g:           2.0e-4
  lr_d:           1.0e-4                                      # TTUR (lr_d < lr_g); auto-flip if D dies (see main.py abort gate)
  beta1:          0.5
  beta2:          0.999
  weight_decay_g: 0.0
  use_bnb_8bit:   true                                        # bitsandbytes 8-bit AdamW; ~700 MB saved on G+D combo

scheduler:
  type:                "cosine_warm_restarts"
  eta_min:             1.0e-6
  linear_decay_epochs: 60
  t_0:                 20
  t_mult:              2

ema:
  use_ema:     true
  decay:       0.999
  start_epoch: 10

loss:
  # Non-blurring stack: no global pixel-L1, no LPIPS (ImageNet prior alien to satellite chroma).
  gan_type:             "lsgan"                               # 'lsgan' | 'hinge'
  gan_weight:           1.0
  fm_weight:            10.0
  lab_chroma_weight:    1.0                                   # CIE LAB (a*, b*) only -- anchors color, leaves luma sharp. Was 5.0 (hfgan-18) but at init lab_chroma * 5 = 43 dominated g_loss=51 and saturated tanh -> near-black collapse. 1.0 keeps the anchor without drowning the other terms.
  wavelet_weight:       1.0                                   # Haar detail subbands (LH/HL/HH) -- sharpens HF
  msssim_weight:        1.0                                   # multi-scale SSIM -- mild structural anchor
  patchnce_weight:      1.0                                   # CUT contrastive on encoder features (novelty)
  ffl_weight:           0.5                                   # focal frequency loss (Jiang ICCV 2021)
  # Explicitly excluded / off
  l1_weight:            0.0                                   # NO global L1 (blurs)
  lpips_weight:         0.0                                   # alien prior; track as val metric only
  # PatchNCE config
  patchnce_layers:      [0, 1, 2, 3]                          # encoder stage feature indices (0=stage1 .. 3=stage4)
  patchnce_n_samples:   256                                   # patches sampled per image per layer
  patchnce_temperature: 0.07
  patchnce_mlp_nc:      256                                   # PatchSampleF MLP output channels
  # Regularisers
  r1_gamma:             0.01                                  # was 0.5 in llwt_v3 (D killed), 0.05 in first smoke (R1 contribution 4.2 vs gan 0.4 -> D over-corrected). 0.01 keeps the gradient penalty effect at ~1/10 of GAN.
  r1_every:             16
  grad_clip_g:          1.0
  grad_clip_d:          5.0
  # GAN-side knobs
  real_label_smooth:    0.9
  fake_label_smooth:    0.0
  # DiffAugment (Zhao NeurIPS 2020) for tiny-dataset GAN training
  diffaug_enabled:      true
  diffaug_policy:       "color,translation,cutout"

system:
  device:        "cuda"
  precision:     "bf16-mixed"
  deterministic: false
  benchmark:     true
  channels_last: true
  compile:       false                                        # Windows venv lacks triton
  max_epochs:    10                                           # FULL SMOKE: 10 epochs at 100% data ~ 22k steps -- enough to leave trivial-gray basin; compare to hfgan-18 ep10 baseline
  image_freq:    1                                            # dump epoch_N.png every N epochs (0 = disabled)
  limit_train_batches: 1.0                                     # 100% of train (~2263 steps/ep at bs=4)
  limit_val_batches:   0.5                                     # 50% of val -- balance metric stability vs time
  check_val_every_n_epoch: 1

  tb_version:    "sar2opt-v1.0.0-tiny-5scenes"                # SwinV2-Tiny variant for fast iteration
  weights_ckpt:  null
  resume_ckpt:   null
  debug:         false
  checkpoints_dir: "checkpoints/sar2opt_v1"
  output_dir:      "./output/sar2opt_v1"
  images_dir:      "./output/sar2opt_v1/images"
  profiler_dir:    "./output/sar2opt_v1/profiler"
  summary_dir:     "./output/sar2opt_v1/summary"
